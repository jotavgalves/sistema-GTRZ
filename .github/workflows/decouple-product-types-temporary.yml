name: Desacoplar tipos de produto temporariamente

on:
  push:
    branches: ['feat/operacao-vouchers-despesas-auditoria']

permissions:
  contents: write

concurrency:
  group: decouple-product-types-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/operacao-vouchers-despesas-auditoria
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Remover ciclo criado pelo tipo visual
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');

          const replace = (path, from, to) => {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(from)) throw new Error(`Trecho não encontrado em ${path}`);
            fs.writeFileSync(path, source.replace(from, to));
          };

          replace(
            'packages/database/src/operation-types.ts',
            "import type { DatabaseProductFallbackIcon } from './product-administration';",
            "import type { DatabaseProductFallbackIcon } from './product-presentation-types';",
          );
          replace(
            'packages/database/src/operation-stock.ts',
            "import type { DatabaseProductFallbackIcon } from './product-administration';",
            "import type { DatabaseProductFallbackIcon } from './product-presentation-types';",
          );
          replace(
            'packages/database/src/product-administration.ts',
            "import { ensureProductExperienceSchema } from './product-experience-migration';\nimport type { DatabaseContext } from './types';\n\nexport type DatabaseProductFallbackIcon =\n  | 'package'\n  | 'beer'\n  | 'cup-soda'\n  | 'coffee'\n  | 'sandwich'\n  | 'pizza'\n  | 'ice-cream'\n  | 'glass-water'\n  | 'candy';",
            "import { ensureProductExperienceSchema } from './product-experience-migration';\nimport type { DatabaseProductFallbackIcon } from './product-presentation-types';\nimport type { DatabaseContext } from './types';\n\nexport type { DatabaseProductFallbackIcon } from './product-presentation-types';",
          );
          NODE
      - run: npm run format
      - name: Commitar desacoplamento
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: remove ciclos de apresentação de produto [skip ci]'
          git push origin HEAD:feat/operacao-vouchers-despesas-auditoria
