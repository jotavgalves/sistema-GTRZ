name: Sincronizar lockfile

on:
  push:
    branches: [feat/fundacao-tecnica]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout da branch
        uses: actions/checkout@v5
        with:
          ref: feat/fundacao-tecnica
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'

      - name: Atualizar somente o lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Registrar lockfile sincronizado
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile já sincronizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sincroniza lockfile seguro"
          git push origin HEAD:feat/fundacao-tecnica
