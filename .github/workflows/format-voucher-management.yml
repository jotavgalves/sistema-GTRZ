name: Formatar gestão de vouchers

on:
  push:
    branches: [feat/navigation-voucher-management-final]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/navigation-voucher-management-final

      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Aplicar Prettier e remover workflow temporário
        run: |
          npx prettier --write \
            apps/desktop/src/renderer/src/features/tables/VoucherCheckout.tsx \
            apps/desktop/src/renderer/src/features/vouchers/useVouchers.ts \
            packages/database/src/voucher-administration.ts \
            packages/database/src/vouchers.ts \
            tests/e2e/voucher-management.spec.ts
          rm .github/workflows/format-voucher-management.yml

      - name: Publicar formatação
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: formata gestão de vouchers [skip ci]'
          git push origin HEAD:feat/navigation-voucher-management-final
