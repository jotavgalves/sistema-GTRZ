name: Ligar ingressos

on:
  push:
    branches: [feat/operacao-evento]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/operacao-evento
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Aplicar ligações
        shell: pwsh
        run: |
          $indexPath = 'packages/database/src/index.ts'
          $text = Get-Content $indexPath -Raw
          $text = $text.Replace(
            "import { financeMigration } from './finance-migration';",
            "import { financeMigration } from './finance-migration';`nimport { ticketMigration } from './ticket-migration';"
          )
          $text = $text.Replace(
            "  financeMigration,`n];",
            "  financeMigration,`n  ticketMigration,`n];"
          )
          $text = $text.Replace(
            "export * from './stock-transfers';",
            "export * from './stock-transfers';`nexport * from './ticket-finance';`nexport * from './tickets';"
          )
          Set-Content $indexPath $text -NoNewline

          $ipcPath = 'apps/desktop/src/main/register-ipc.ts'
          $text = Get-Content $ipcPath -Raw
          $text = $text.Replace(
            "import { registerOperationsIpcHandlers } from './register-operations-ipc';",
            "import { registerOperationsIpcHandlers } from './register-operations-ipc';`nimport { registerTicketIpcHandlers } from './register-ticket-ipc';"
          )
          $text = $text.Replace(
            "  registerOperationsIpcHandlers({ getDatabase: options.getDatabase });",
            "  registerOperationsIpcHandlers({ getDatabase: options.getDatabase });`n  registerTicketIpcHandlers({ getDatabase: options.getDatabase });"
          )
          Set-Content $ipcPath $text -NoNewline

          $preloadPath = 'apps/desktop/src/preload/index.ts'
          $text = Get-Content $preloadPath -Raw
          $text = $text.Replace(
            "import { operationsApi } from './operations-api';",
            "import { operationsApi } from './operations-api';`nimport { ticketApi } from './ticket-api';"
          )
          $text = $text.Replace(
            "  expenses: expenseApi,",
            "  expenses: expenseApi,`n  tickets: ticketApi,"
          )
          Set-Content $preloadPath $text -NoNewline

          $cashPath = 'packages/database/src/cash.ts'
          $text = Get-Content $cashPath -Raw
          $text = $text.Replace(
            "import type { DatabaseContext } from './types';",
            "import { getTicketSalesByMethod } from './ticket-finance';`nimport type { DatabaseContext } from './types';"
          )
          $text = $text.Replace(
            "  let cashCents = 0;",
            "  const ticketSales = getTicketSalesByMethod(database, eventId);`n  let cashCents = 0;"
          )
          $text = $text.Replace(
            "    cashCents,`n    pixCents,`n    creditCardCents,`n    debitCardCents,",
            "    cashCents: cashCents + ticketSales.cashCents,`n    pixCents: pixCents + ticketSales.pixCents,`n    creditCardCents: creditCardCents + ticketSales.creditCardCents,`n    debitCardCents: debitCardCents + ticketSales.debitCardCents,"
          )
          Set-Content $cashPath $text -NoNewline

      - name: Formatar
        run: >-
          npx prettier --write
          packages/database/src/index.ts
          packages/database/src/cash.ts
          apps/desktop/src/main/register-ipc.ts
          apps/desktop/src/preload/index.ts

      - name: Registrar resultado
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/database/src/index.ts \
            packages/database/src/cash.ts \
            apps/desktop/src/main/register-ipc.ts \
            apps/desktop/src/preload/index.ts
          git commit -m "feat: conecta ingressos à aplicação e ao caixa"
          git push origin HEAD:feat/operacao-evento
