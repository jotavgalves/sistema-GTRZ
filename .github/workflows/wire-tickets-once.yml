name: Finalizar ligação de ingressos

on:
  push:
    branches: [feat/operacao-evento]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/operacao-evento
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Corrigir ligações de forma idempotente
        shell: pwsh
        run: |
          $indexPath = 'packages/database/src/index.ts'
          $text = Get-Content $indexPath -Raw
          $text = [regex]::Replace(
            $text,
            "(?:import \{ ticketMigration \} from './ticket-migration';\r?\n)+",
            "import { ticketMigration } from './ticket-migration';`n"
          )
          $text = [regex]::Replace(
            $text,
            "(?:export \* from './ticket-finance';\r?\n)+",
            "export * from './ticket-finance';`n"
          )
          $text = [regex]::Replace(
            $text,
            "(?:export \* from './tickets';\r?\n)+",
            "export * from './tickets';`n"
          )
          Set-Content $indexPath $text -NoNewline

          $ipcPath = 'apps/desktop/src/main/register-ipc.ts'
          $text = Get-Content $ipcPath -Raw
          $text = [regex]::Replace(
            $text,
            "(?:import \{ registerTicketIpcHandlers \} from './register-ticket-ipc';\r?\n)+",
            "import { registerTicketIpcHandlers } from './register-ticket-ipc';`n"
          )
          $text = [regex]::Replace(
            $text,
            "(?:  registerTicketIpcHandlers\(\{ getDatabase: options\.getDatabase \}\);\r?\n)+",
            "  registerTicketIpcHandlers({ getDatabase: options.getDatabase });`n"
          )
          Set-Content $ipcPath $text -NoNewline

          $preloadPath = 'apps/desktop/src/preload/index.ts'
          $text = Get-Content $preloadPath -Raw
          $text = [regex]::Replace(
            $text,
            "(?:import \{ ticketApi \} from './ticket-api';\r?\n)+",
            "import { ticketApi } from './ticket-api';`n"
          )
          $text = [regex]::Replace(
            $text,
            "(?:  tickets: ticketApi,\r?\n)+",
            "  tickets: ticketApi,`n"
          )
          Set-Content $preloadPath $text -NoNewline

          $cashPath = 'packages/database/src/cash.ts'
          $text = Get-Content $cashPath -Raw
          $text = [regex]::Replace(
            $text,
            "(?:import \{ getTicketSalesByMethod \} from './ticket-finance';\r?\n)+",
            "import { getTicketSalesByMethod } from './ticket-finance';`n"
          )
          $text = [regex]::Replace(
            $text,
            "(?:  const ticketSales = getTicketSalesByMethod\(database, eventId\);\r?\n)+",
            "  const ticketSales = getTicketSalesByMethod(database, eventId);`n"
          )
          Set-Content $cashPath $text -NoNewline

          Set-Content \
            'apps/desktop/src/renderer/src/features/tickets/index.tsx' \
            "export { TicketsPage } from './TicketsPage';`n" \
            -NoNewline

          $globalPath = 'apps/desktop/src/renderer/src/styles/global.css'
          $text = Get-Content $globalPath -Raw
          $text = [regex]::Replace($text, "(?:@import './tickets.css';\r?\n)+", '')
          $text = $text.TrimEnd() + "`n@import './tickets.css';`n"
          Set-Content $globalPath $text -NoNewline

      - name: Formatar arquivos alterados
        run: >-
          npx prettier --write
          packages/database/src/index.ts
          packages/database/src/cash.ts
          apps/desktop/src/main/register-ipc.ts
          apps/desktop/src/preload/index.ts
          apps/desktop/src/renderer/src/features/tickets/index.tsx
          apps/desktop/src/renderer/src/styles/global.css

      - name: Registrar resultado
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/database/src/index.ts \
            packages/database/src/cash.ts \
            apps/desktop/src/main/register-ipc.ts \
            apps/desktop/src/preload/index.ts \
            apps/desktop/src/renderer/src/features/tickets/index.tsx \
            apps/desktop/src/renderer/src/styles/global.css
          git commit -m "fix: finaliza ligação do módulo de ingressos"
          git push origin HEAD:feat/operacao-evento
