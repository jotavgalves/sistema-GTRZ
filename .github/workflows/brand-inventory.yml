name: Inventário temporário de logos

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  extract-brand:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extrair logos
        run: |
          rm -rf brand-preview
          mkdir -p brand-preview/files
          unzip -o LOGOS.zip -d brand-preview/files
          find brand-preview/files -type f -printf '%P\n' | sort > brand-preview/inventory.txt
          python - <<'PY'
          from pathlib import Path
          import html

          root = Path('brand-preview/files')
          files = sorted(p for p in root.rglob('*') if p.is_file())
          cards = []
          for file in files:
              rel = file.relative_to(Path('brand-preview')).as_posix()
              suffix = file.suffix.lower()
              if suffix in {'.svg', '.png', '.jpg', '.jpeg', '.webp'}:
                  cards.append(
                      f'<article><div class="preview"><img src="{html.escape(rel)}" alt=""></div>'
                      f'<code>{html.escape(str(file.relative_to(root)))}</code></article>'
                  )
          page = '''<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">'''
          page += '''<title>Logos GTRZ</title><style>body{font:14px system-ui;background:#18181b;color:#fff;padding:24px}'''
          page += '''main{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}'''
          page += '''article{background:#27272a;border:1px solid #3f3f46;border-radius:14px;padding:14px}'''
          page += '''.preview{height:190px;display:grid;place-items:center;background:linear-gradient(135deg,#09090b 50%,#f4f4f5 50%);border-radius:10px;padding:18px}'''
          page += '''img{max-width:100%;max-height:100%}code{display:block;margin-top:10px;overflow-wrap:anywhere}</style></head><body>'''
          page += f'<h1>Inventário oficial GTRZ</h1><p>{len(cards)} arquivos visuais</p><main>{"".join(cards)}</main></body></html>'
          Path('brand-preview/index.html').write_text(page, encoding='utf-8')
          PY

      - name: Publicar inventário
        uses: actions/upload-artifact@v7
        with:
          name: GTRZ-Brand-Inventory
          path: brand-preview
          if-no-files-found: error
          retention-days: 7
