name: Preparar identidade visual oficial

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare-brand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout da branch do PR
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Instalar conversor de imagens
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Extrair logos e gerar ícones
        run: |
          rm -rf brand-preview .brand-source
          mkdir -p brand-preview/files
          unzip -o LOGOS.zip -d brand-preview/files
          cp -R brand-preview/files .brand-source
          find brand-preview/files -type f -printf '%P\n' | sort > brand-preview/inventory.txt

          mkdir -p apps/desktop/src/renderer/src/assets/brand
          mkdir -p apps/desktop/resources/branding

          cp '.brand-source/LOGOS/LOGOS VERMELHO/GTRZ LOGOMARCA - SEM EVENTOS - PADRÃO VERMELHO.svg' \
             'apps/desktop/src/renderer/src/assets/brand/gtrz-lockup.svg'
          cp '.brand-source/LOGOS/LOGOS VERMELHO/GTRZ LOGO PADRÃO VERMELHO.svg' \
             'apps/desktop/src/renderer/src/assets/brand/gtrz-symbol.svg'
          cp '.brand-source/LOGOS/LOGOS BRANCOS/GTRZ LOGOMARCA - SEM EVENTOS - ALL WHITE.svg' \
             'apps/desktop/src/renderer/src/assets/brand/gtrz-lockup-white.svg'

          cp 'apps/desktop/src/renderer/src/assets/brand/gtrz-lockup.svg' \
             'apps/desktop/resources/branding/gtrz-lockup.svg'
          cp 'apps/desktop/src/renderer/src/assets/brand/gtrz-symbol.svg' \
             'apps/desktop/resources/branding/gtrz-symbol.svg'

          convert -background none \
            '.brand-source/LOGOS/LOGOS VERMELHO/GTRZ LOGO PADRÃO VERMELHO.svg' \
            -resize 512x512 -gravity center -extent 512x512 \
            'apps/desktop/resources/icon.png'
          convert 'apps/desktop/resources/icon.png' \
            -define icon:auto-resize=256,128,64,48,32,24,16 \
            'apps/desktop/resources/icon.ico'

      - name: Publicar ativos na branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src/renderer/src/assets/brand apps/desktop/resources
          if ! git diff --cached --quiet; then
            git commit -m 'feat: adiciona identidade visual oficial da GTRZ'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Publicar inventário temporário
        uses: actions/upload-artifact@v7
        with:
          name: GTRZ-Brand-Inventory
          path: brand-preview
          if-no-files-found: error
          retention-days: 7
