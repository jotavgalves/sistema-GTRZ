name: Corrigir lint de vouchers

on:
  push:
    branches: [feat/navigation-voucher-management-final]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/navigation-voucher-management-final

      - name: Aplicar encadeamento opcional
        shell: python
        run: |
          from pathlib import Path

          paths = [
              Path('packages/database/src/voucher-administration.ts'),
              Path('packages/database/src/voucher-deletion.ts'),
              Path('packages/database/src/vouchers.ts'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              text = text.replace(
                  'if (row === undefined || row.deleted_at !== null) {',
                  'if (row?.deleted_at !== null) {',
              )
              text = text.replace(
                  'if (voucher === undefined || voucher.deleted_at !== null) {',
                  'if (voucher?.deleted_at !== null) {',
              )
              path.write_text(text, encoding='utf-8')

      - name: Remover workflow temporário
        run: rm .github/workflows/fix-voucher-lint.yml

      - name: Publicar correção
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: aplica encadeamento opcional em vouchers [skip ci]'
          git push origin HEAD:feat/navigation-voucher-management-final
