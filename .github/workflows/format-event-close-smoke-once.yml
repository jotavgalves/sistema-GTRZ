name: Formatar smoke de encerramento

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'feat/operacao-evento'
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/operacao-evento
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npx prettier --write tests/e2e/event-close.spec.ts

      - name: Registrar resultado
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/event-close.spec.ts
          git commit -m "style: formata smoke de encerramento"
          git push origin HEAD:feat/operacao-evento
