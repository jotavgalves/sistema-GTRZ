name: Formatar fundação

on:
  push:
    branches: [feat/fundacao-tecnica]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          ref: feat/fundacao-tecnica
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'

      - name: Instalar dependências
        run: npm install --ignore-scripts

      - name: Aplicar Prettier
        run: npm run format

      - name: Registrar arquivos formatados e lockfile
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Nenhuma alteração de formatação."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: aplica formatação automática"
          git push origin HEAD:feat/fundacao-tecnica
