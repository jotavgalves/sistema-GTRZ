name: Corrigir lint temporariamente

on:
  push:
    branches: ['feat/operacao-vouchers-despesas-auditoria']

permissions:
  contents: write

concurrency:
  group: lint-fix-temporary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/operacao-vouchers-despesas-auditoria
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Ajustar import das opções de ícone
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/desktop/src/renderer/src/features/inventory/ProductForm.tsx';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace(
            "import { PRODUCT_ICON_OPTIONS, ProductVisual } from './ProductVisual';",
            "import { PRODUCT_ICON_OPTIONS } from './product-icon-options';\nimport { ProductVisual } from './ProductVisual';",
          );
          fs.writeFileSync(path, source);
          NODE
      - name: Aplicar correções automáticas do ESLint
        shell: bash
        run: npx eslint . --fix || true
      - run: npm run format
      - name: Commitar correções
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: aplica autofix de lint [skip ci]'
          git push origin HEAD:feat/operacao-vouchers-despesas-auditoria
