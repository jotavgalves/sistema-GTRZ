name: Formatar correção do checkout

on:
  push:
    branches: [fix/checkout-voucher-troco-final]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: fix/checkout-voucher-troco-final

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Aplicar Prettier
        run: npx prettier --write apps/desktop/src/renderer/src/features/tables/CheckoutForm.tsx packages/database/src/operation-checkout.ts

      - name: Publicar formatação
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src/renderer/src/features/tables/CheckoutForm.tsx packages/database/src/operation-checkout.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style: aplica Prettier no checkout [skip ci]'
            git push origin HEAD:fix/checkout-voucher-troco-final
          fi
