name: Corrigir resumo de caixa

on:
  push:
    branches: [feat/operacao-evento]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/operacao-evento
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Corrigir bloco de totais
        shell: pwsh
        run: |
          $path = 'packages/database/src/cash.ts'
          $text = Get-Content $path -Raw
          $pattern = "(?s)  const totals: DatabaseSalesByMethod = \{.*?  const voucher = database\.sqlite"
          $replacement = @'
            let cashCents = 0;
            let pixCents = 0;
            let creditCardCents = 0;
            let debitCardCents = 0;

            for (const row of rows) {
              if (row.method === 'cash') {
                cashCents = row.amount_cents;
              } else if (row.method === 'pix') {
                pixCents = row.amount_cents;
              } else if (row.method === 'credit-card') {
                creditCardCents = row.amount_cents;
              } else {
                debitCardCents = row.amount_cents;
              }
            }

            const voucher = database.sqlite
          '@
          $updated = [regex]::Replace($text, $pattern, $replacement.Trim(), 1)
          if ($updated -eq $text) { throw 'Bloco de totais não encontrado.' }
          Set-Content $path $updated -NoNewline

      - name: Formatar
        run: npx prettier --write packages/database/src/cash.ts

      - name: Registrar resultado
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src/cash.ts
          git commit -m "fix: corrige resumo de vendas por meio"
          git push origin HEAD:feat/operacao-evento
