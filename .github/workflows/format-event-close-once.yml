name: Formatar encerramento integrado

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'feat/operacao-evento'
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/operacao-evento
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Aplicar Prettier
        run: >-
          npx prettier --write
          apps/desktop/src/main/register-event-close-ipc.ts
          apps/desktop/src/renderer/src/features/events/EventClosePanel.tsx
          apps/desktop/src/renderer/src/features/events/EventsPage.tsx
          apps/desktop/src/renderer/src/styles/event-close.css
          packages/database/src/event-close.ts

      - name: Registrar resultado
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/main/register-event-close-ipc.ts \
            apps/desktop/src/renderer/src/features/events/EventClosePanel.tsx \
            apps/desktop/src/renderer/src/features/events/EventsPage.tsx \
            apps/desktop/src/renderer/src/styles/event-close.css \
            packages/database/src/event-close.ts
          git commit -m "style: formata encerramento integrado"
          git push origin HEAD:feat/operacao-evento
