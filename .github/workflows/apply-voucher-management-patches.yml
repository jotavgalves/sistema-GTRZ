name: Aplicar conexões da gestão de vouchers

on:
  push:
    branches: [feat/navigation-voucher-management-final]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/navigation-voucher-management-final

      - name: Aplicar conexões
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise RuntimeError(f'Trecho não encontrado em {path}: {old!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'packages/database/src/index.ts',
              "import { voucherOrderMigration } from './voucher-order-migration';",
              "import { voucherManagementMigration } from './voucher-management-migration';\nimport { voucherOrderMigration } from './voucher-order-migration';",
          )
          replace_once(
              'packages/database/src/index.ts',
              '  voucherOrderMigration,\n];',
              '  voucherOrderMigration,\n  voucherManagementMigration,\n];',
          )
          replace_once(
              'packages/database/src/index.ts',
              "export * from './vouchers';",
              "export * from './voucher-deletion';\nexport * from './vouchers';",
          )
          replace_once(
              'packages/contracts/src/index.ts',
              "  vouchersCreate: 'vouchers:create',\n  vouchersChangeStatus: 'vouchers:change-status',",
              "  vouchersCreate: 'vouchers:create',\n  vouchersUpdate: 'vouchers:update',\n  vouchersChangeStatus: 'vouchers:change-status',\n  vouchersPreviewDeletion: 'vouchers:preview-deletion',\n  vouchersDelete: 'vouchers:delete',",
          )
          replace_once(
              'packages/contracts/src/operations.ts',
              "  status: z.enum(['active', 'exhausted', 'cancelled']),\n  createdAt:",
              "  status: z.enum(['active', 'exhausted', 'cancelled']),\n  servicePointId: z.uuid().nullable(),\n  servicePointLabel: z.string().trim().min(1).max(40).nullable(),\n  createdAt:",
          )

      - name: Formatar
        run: npx prettier --write packages/database/src/index.ts packages/contracts/src/index.ts packages/contracts/src/operations.ts

      - name: Publicar conexões
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/database/src/index.ts packages/contracts/src/index.ts packages/contracts/src/operations.ts
          if ! git diff --cached --quiet; then
            git commit -m 'chore: conecta migração e canais de vouchers [skip ci]'
            git push origin HEAD:feat/navigation-voucher-management-final
          fi
