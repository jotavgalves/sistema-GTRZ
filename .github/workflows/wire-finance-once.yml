name: Ligar módulo financeiro

on:
  push:
    branches: [feat/operacao-evento]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/operacao-evento
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Aplicar ligações
        shell: pwsh
        run: |
          $indexPath = 'packages/database/src/index.ts'
          $text = Get-Content $indexPath -Raw
          $text = $text.Replace(
            "import { technicalSchema } from './schema';",
            "import { financeMigration } from './finance-migration';`nimport { technicalSchema } from './schema';"
          )
          $text = $text.Replace(
            "  },`n];`n`nfunction ensureMigrationTable",
            "  },`n  financeMigration,`n];`n`nfunction ensureMigrationTable"
          )
          $text = $text.Replace(
            "export * from './backup';",
            "export * from './backup';`nexport * from './cash';"
          )
          $text = $text.Replace(
            "export * from './control';",
            "export * from './control';`nexport * from './expenses';"
          )
          Set-Content $indexPath $text -NoNewline

          $ipcPath = 'apps/desktop/src/main/register-ipc.ts'
          $text = Get-Content $ipcPath -Raw
          $text = $text.Replace(
            "import { registerComboIpcHandlers } from './register-combo-ipc';",
            "import { registerComboIpcHandlers } from './register-combo-ipc';`nimport { registerFinanceIpcHandlers } from './register-finance-ipc';"
          )
          $text = $text.Replace(
            "  registerComboIpcHandlers({ getDatabase: options.getDatabase });",
            "  registerComboIpcHandlers({ getDatabase: options.getDatabase });`n  registerFinanceIpcHandlers({ getDatabase: options.getDatabase });"
          )
          Set-Content $ipcPath $text -NoNewline

          $preloadPath = 'apps/desktop/src/preload/index.ts'
          $text = Get-Content $preloadPath -Raw
          $text = $text.Replace(
            "import { inventoryApi } from './inventory-api';",
            "import { cashApi, expenseApi } from './finance-api';`nimport { inventoryApi } from './inventory-api';"
          )
          $text = $text.Replace(
            "  vouchers: voucherApi,",
            "  vouchers: voucherApi,`n  cash: cashApi,`n  expenses: expenseApi,"
          )
          Set-Content $preloadPath $text -NoNewline

          $cashPath = 'packages/database/src/cash.ts'
          $text = Get-Content $cashPath -Raw
          $old = @'
          const totals: DatabaseSalesByMethod = {
            cashCents: 0,
            pixCents: 0,
            creditCardCents: 0,
            debitCardCents: 0,
            voucherCents: 0,
          };

          for (const row of rows) {
            if (row.method === 'cash') {
              totals.cashCents = row.amount_cents;
            } else if (row.method === 'pix') {
              totals.pixCents = row.amount_cents;
            } else if (row.method === 'credit-card') {
              totals.creditCardCents = row.amount_cents;
            } else {
              totals.debitCardCents = row.amount_cents;
            }
          }

          const voucher = database.sqlite
          '@
          $new = @'
          let cashCents = 0;
          let pixCents = 0;
          let creditCardCents = 0;
          let debitCardCents = 0;

          for (const row of rows) {
            if (row.method === 'cash') {
              cashCents = row.amount_cents;
            } else if (row.method === 'pix') {
              pixCents = row.amount_cents;
            } else if (row.method === 'credit-card') {
              creditCardCents = row.amount_cents;
            } else {
              debitCardCents = row.amount_cents;
            }
          }

          const voucher = database.sqlite
          '@
          $text = $text.Replace($old.Trim(), $new.Trim())
          $text = $text.Replace(
            "  totals.voucherCents = voucher.amount_cents;`n  return totals;",
            "  return {`n    cashCents,`n    pixCents,`n    creditCardCents,`n    debitCardCents,`n    voucherCents: voucher.amount_cents,`n  };"
          )
          Set-Content $cashPath $text -NoNewline

      - name: Formatar arquivos alterados
        run: >-
          npx prettier --write
          packages/database/src/index.ts
          packages/database/src/cash.ts
          apps/desktop/src/main/register-ipc.ts
          apps/desktop/src/preload/index.ts

      - name: Registrar resultado
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/database/src/index.ts \
            packages/database/src/cash.ts \
            apps/desktop/src/main/register-ipc.ts \
            apps/desktop/src/preload/index.ts
          git commit -m "feat: conecta módulo financeiro à aplicação"
          git push origin HEAD:feat/operacao-evento
