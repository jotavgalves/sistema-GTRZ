name: Ligar módulo financeiro

on:
  push:
    branches: [feat/operacao-evento]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/operacao-evento
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Aplicar ligações
        shell: python
        run: |
          from pathlib import Path

          index = Path('packages/database/src/index.ts')
          text = index.read_text(encoding='utf-8')
          text = text.replace(
              "import { technicalSchema } from './schema';",
              "import { financeMigration } from './finance-migration';\nimport { technicalSchema } from './schema';",
          )
          marker = "  {\n    version: 7,\n    name: 'vouchers-and-balance-ledger',"
          if marker not in text:
              raise SystemExit('migration 7 marker missing')
          closing = "  },\n];\n\nfunction ensureMigrationTable"
          text = text.replace(closing, "  },\n  financeMigration,\n];\n\nfunction ensureMigrationTable", 1)
          text = text.replace("export * from './backup';", "export * from './backup';\nexport * from './cash';")
          text = text.replace("export * from './control';", "export * from './control';\nexport * from './expenses';")
          index.write_text(text, encoding='utf-8')

          ipc = Path('apps/desktop/src/main/register-ipc.ts')
          text = ipc.read_text(encoding='utf-8')
          text = text.replace(
              "import { registerComboIpcHandlers } from './register-combo-ipc';",
              "import { registerComboIpcHandlers } from './register-combo-ipc';\nimport { registerFinanceIpcHandlers } from './register-finance-ipc';",
          )
          text = text.replace(
              "  registerComboIpcHandlers({ getDatabase: options.getDatabase });",
              "  registerComboIpcHandlers({ getDatabase: options.getDatabase });\n  registerFinanceIpcHandlers({ getDatabase: options.getDatabase });",
          )
          ipc.write_text(text, encoding='utf-8')

          preload = Path('apps/desktop/src/preload/index.ts')
          text = preload.read_text(encoding='utf-8')
          text = text.replace(
              "import { inventoryApi } from './inventory-api';",
              "import { cashApi, expenseApi } from './finance-api';\nimport { inventoryApi } from './inventory-api';",
          )
          text = text.replace(
              "  vouchers: voucherApi,",
              "  vouchers: voucherApi,\n  cash: cashApi,\n  expenses: expenseApi,",
          )
          preload.write_text(text, encoding='utf-8')

          cash = Path('packages/database/src/cash.ts')
          text = cash.read_text(encoding='utf-8')
          old = """  const totals: DatabaseSalesByMethod = {
    cashCents: 0,
    pixCents: 0,
    creditCardCents: 0,
    debitCardCents: 0,
    voucherCents: 0,
  };

  for (const row of rows) {
    if (row.method === 'cash') {
      totals.cashCents = row.amount_cents;
    } else if (row.method === 'pix') {
      totals.pixCents = row.amount_cents;
    } else if (row.method === 'credit-card') {
      totals.creditCardCents = row.amount_cents;
    } else {
      totals.debitCardCents = row.amount_cents;
    }
  }

  const voucher = database.sqlite
"""
          new = """  let cashCents = 0;
  let pixCents = 0;
  let creditCardCents = 0;
  let debitCardCents = 0;

  for (const row of rows) {
    if (row.method === 'cash') {
      cashCents = row.amount_cents;
    } else if (row.method === 'pix') {
      pixCents = row.amount_cents;
    } else if (row.method === 'credit-card') {
      creditCardCents = row.amount_cents;
    } else {
      debitCardCents = row.amount_cents;
    }
  }

  const voucher = database.sqlite
"""
          if old not in text:
              raise SystemExit('cash totals block missing')
          text = text.replace(old, new)
          text = text.replace(
              "  totals.voucherCents = voucher.amount_cents;\n  return totals;",
              "  return {\n    cashCents,\n    pixCents,\n    creditCardCents,\n    debitCardCents,\n    voucherCents: voucher.amount_cents,\n  };",
          )
          cash.write_text(text, encoding='utf-8')

      - name: Formatar arquivos alterados
        run: >-
          npx prettier --write
          packages/database/src/index.ts
          packages/database/src/cash.ts
          apps/desktop/src/main/register-ipc.ts
          apps/desktop/src/preload/index.ts

      - name: Registrar resultado
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/database/src/index.ts \
            packages/database/src/cash.ts \
            apps/desktop/src/main/register-ipc.ts \
            apps/desktop/src/preload/index.ts
          git commit -m "feat: conecta módulo financeiro à aplicação"
          git push origin HEAD:feat/operacao-evento
