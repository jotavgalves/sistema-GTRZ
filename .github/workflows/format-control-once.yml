name: Formatar controle do sistema

on:
  push:
    branches: [feat/controle-do-sistema]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout da branch
        uses: actions/checkout@v5
        with:
          ref: feat/controle-do-sistema
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Aplicar Prettier
        run: npx prettier --write apps/desktop/src/main/register-ipc.ts apps/desktop/src/preload/index.ts apps/desktop/src/renderer/src/app/layouts/AppShell.tsx apps/desktop/src/renderer/src/features/events/EventsPage.tsx packages/contracts/src/index.ts packages/database/src/control.ts packages/database/src/index.spec.ts

      - name: Registrar formatação
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Arquivos já formatados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/main/register-ipc.ts apps/desktop/src/preload/index.ts apps/desktop/src/renderer/src/app/layouts/AppShell.tsx apps/desktop/src/renderer/src/features/events/EventsPage.tsx packages/contracts/src/index.ts packages/database/src/control.ts packages/database/src/index.spec.ts
          git commit -m "style: aplica padrão da Macroetapa 1"
          git push origin HEAD:feat/controle-do-sistema
