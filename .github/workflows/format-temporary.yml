name: Formatar branch temporariamente

on:
  push:
    branches: ['feat/operacao-vouchers-despesas-auditoria']

permissions:
  contents: write

concurrency:
  group: format-temporary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/operacao-vouchers-despesas-auditoria
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format
      - name: Commitar somente a formatação
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: aplica prettier [skip ci]'
          git push origin HEAD:feat/operacao-vouchers-despesas-auditoria
