name: Exportar fonte temporariamente

on:
  push:
    branches:
      - feat/operacao-vouchers-despesas-auditoria
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/operacao-vouchers-despesas-auditoria
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Formatar arquivos alterados
        run: >-
          npx prettier --write
          apps/desktop/src/renderer/src/features/inventory/ProductCard.tsx
          apps/desktop/src/renderer/src/features/vouchers/VoucherEditForm.tsx
          apps/desktop/src/renderer/src/features/vouchers/VoucherForm.tsx
          packages/database/src/operation-vouchers.ts
          packages/database/src/voucher-administration.ts
          packages/database/src/voucher-management.spec.ts
          packages/database/src/vouchers.spec.ts
          tests/e2e/combos.spec.ts
          tests/e2e/operations.spec.ts
          tests/e2e/shell.spec.ts
          tests/e2e/tickets.spec.ts
          tests/e2e/transfers.spec.ts
          tests/e2e/voucher-management.spec.ts
          tests/e2e/vouchers.spec.ts

      - name: Commitar somente a formatação
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/desktop/src/renderer/src/features/inventory/ProductCard.tsx \
            apps/desktop/src/renderer/src/features/vouchers/VoucherEditForm.tsx \
            apps/desktop/src/renderer/src/features/vouchers/VoucherForm.tsx \
            packages/database/src/operation-vouchers.ts \
            packages/database/src/voucher-administration.ts \
            packages/database/src/voucher-management.spec.ts \
            packages/database/src/vouchers.spec.ts \
            tests/e2e/combos.spec.ts \
            tests/e2e/operations.spec.ts \
            tests/e2e/shell.spec.ts \
            tests/e2e/tickets.spec.ts \
            tests/e2e/transfers.spec.ts \
            tests/e2e/voucher-management.spec.ts \
            tests/e2e/vouchers.spec.ts
          git commit -m 'style: formata lote final [skip ci]'
          git push origin HEAD:feat/operacao-vouchers-despesas-auditoria
