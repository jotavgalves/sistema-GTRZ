name: Qualidade e arquitetura

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**', 'fix/**']

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript, arquitetura e testes
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Instalar dependências reproduzíveis
        run: npm ci --ignore-scripts

      - name: Bloquear vulnerabilidades altas ou críticas
        run: npm audit --audit-level=high

      - name: Reconstruir dependências nativas do Electron
        run: npx electron-builder install-app-deps

      - name: Validar qualidade
        run: npm run quality

      - name: Gerar build
        run: npm run build --workspace @gtrz/desktop

      - name: Executar smoke E2E do Electron
        if: github.event_name != 'pull_request'
        run: npx playwright test

      - name: Gerar instalador Windows
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: npm run package:win

      - name: Publicar instalador Windows
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v7
        with:
          name: GTRZ-System-Windows
          path: release/GTRZ-System-*-Setup.exe
          if-no-files-found: error
          retention-days: 30
