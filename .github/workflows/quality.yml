name: Qualidade e arquitetura

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**', 'fix/**']

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript, arquitetura e testes
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Instalar dependências reproduzíveis
        run: npm ci --ignore-scripts

      - name: Diagnosticar auditoria completa
        shell: bash
        run: npm audit --json || true

      - name: Diagnosticar dependências de produção
        shell: bash
        run: npm audit --omit=dev --json || true

      - name: Reconstruir dependências nativas do Electron
        run: npx electron-builder install-app-deps

      - name: Validar qualidade
        run: npm run quality

      - name: Gerar build
        run: npm run build --workspace @gtrz/desktop

      - name: Executar smoke E2E do Electron
        run: npx playwright test
