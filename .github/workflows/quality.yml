name: Qualidade e arquitetura

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**', 'fix/**']

permissions:
  contents: write

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript, arquitetura e testes
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/fundacao-tecnica
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'

      - name: Instalar dependências
        run: npm install --ignore-scripts

      - name: Aplicar formatação determinística
        run: npm run format

      - name: Registrar formatação e lockfile
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Arquivos já formatados."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: aplica formatação automática"
            git push origin HEAD:feat/fundacao-tecnica
          fi

      - name: Reconstruir dependências nativas do Electron
        run: npx electron-builder install-app-deps

      - name: Validar qualidade
        run: npm run quality

      - name: Gerar build
        run: npm run build --workspace @gtrz/desktop

      - name: Executar smoke E2E do Electron
        run: npx playwright test
