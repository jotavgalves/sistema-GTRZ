name: Formatar refactor de ingressos

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'feat/operacao-evento'
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout da branch
        uses: actions/checkout@v5
        with:
          ref: feat/operacao-evento
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Aplicar Prettier
        run: >-
          npx prettier --write
          packages/database/src/ticket-model.ts
          packages/database/src/ticket-repository.ts
          packages/database/src/ticket-lots.ts
          packages/database/src/ticket-sales.ts
          packages/database/src/tickets.ts

      - name: Registrar resultado
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/database/src/ticket-model.ts \
            packages/database/src/ticket-repository.ts \
            packages/database/src/ticket-lots.ts \
            packages/database/src/ticket-sales.ts \
            packages/database/src/tickets.ts
          git commit -m "style: formata refactor de ingressos"
          git push origin HEAD:feat/operacao-evento
