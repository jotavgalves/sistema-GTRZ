name: Formatar etapa de identidade visual

on:
  push:
    branches: [feat/dashboard-audit-branding]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/dashboard-audit-branding

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Aplicar Prettier
        run: npx prettier --write apps/desktop/src/renderer/src/features/dashboard/DashboardPanels.tsx apps/desktop/src/renderer/src/styles/layout.css

      - name: Publicar formatação
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src/renderer/src/features/dashboard/DashboardPanels.tsx apps/desktop/src/renderer/src/styles/layout.css
          if ! git diff --cached --quiet; then
            git commit -m 'style: formata dashboard e identidade visual'
            git push origin HEAD:feat/dashboard-audit-branding
          fi
