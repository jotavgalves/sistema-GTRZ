name: Formatar módulo de backups

on:
  push:
    branches: [feat/backups-importacao]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/backups-importacao
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Aplicar Prettier
        run: npx prettier --write apps/desktop/src/main/backup-service.ts apps/desktop/src/main/index.ts apps/desktop/src/renderer/src/features/backups/BackupsPage.tsx apps/desktop/src/renderer/src/features/backups/useBackups.ts packages/contracts/src/index.spec.ts

      - name: Registrar resultado
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/main/backup-service.ts apps/desktop/src/main/index.ts apps/desktop/src/renderer/src/features/backups/BackupsPage.tsx apps/desktop/src/renderer/src/features/backups/useBackups.ts packages/contracts/src/index.spec.ts
          git commit -m "style: formata módulo de backups"
          git push origin HEAD:feat/backups-importacao
